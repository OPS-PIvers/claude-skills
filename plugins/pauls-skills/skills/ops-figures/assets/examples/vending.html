<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vending machine</title>
</head>
<body>
<script src="core.js"></script>
<script>
/* A how-it-works figure: labels on the working parts, a Predict question before each key step, and a walk-through.
   The real sequence, and where the money and the drink are after each step:
   1 Insert 50c (x4)   each coin slides into the slot; the machine checks it   money: hand → slot → coin box, credit $2.00
   2 Choose a drink    A then 1 on the keypad: the spiral behind A1 turns once and pushes the front can off the shelf;
                       it drops behind the glass into the pickup tray       drink: shelf → tray, credit $2.00 → $0.50
   3 Take your drink   pull the pickup door down, lift the can out; the door falls shut   drink: tray → you
   4 Return change     the credit not spent drops down a chute into the coin cup   money: coin box → cup, credit $0
   (5 Take coins       the change comes out of the cup                      money: cup → you) */

/* ---------- geometry (x = depth, y = width, z = height) ---------- */
const W = 90, D = 130, H = 232, R = 8, T = 6;
const WIN = [40,62,122,196];          // glass window on the front: y0,z0,y1,z1
const TRAY = [44,16,118,42];          // pickup opening
const CUP = [12,64,30,80];            // coin-return cup under the return button
const SHELF_X = 74;                   // front edge of the shelves: the gap to the glass is wide enough for a can to fall
const ITEM_X = 58, ITEM_STEP = 16;    // front item depth, spacing of the items queued behind it (= one turn of the spiral)
const FALL_X = 80.5;                  // depth of a product falling in the gap between the shelves and the glass
const COL_Y = [92,72,52,32];          // columns 1-4, left to right on screen
const ROWS = [
  { code:'A', s:142, kind:'can',    price:1.5, cols:['#e2473a','#2f6fd6','#f2c230','#38a565'] },
  { code:'B', s:110, kind:'can',    price:1.5, cols:['#8c4bd1','#f08a2b','#ece6d6','#33302c'] },
  { code:'C', s:78,  kind:'bottle', price:2.0, cols:['#f07b2a','#5cc0e8','#d94f86','#9ccc3c'] },
  { code:'D', s:46,  kind:'snack',  price:1.0, cols:['#f2c230','#e2473a','#3e86d9','#8a5a3c'] },
];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const trayY = c => clamp(COL_Y[c], 52, 90);   // where a product from column c lands in the tray (a sloped bin guides it)


/* ---------- turn-aware helpers ---------- */
// axis-aligned box drawing only the faces toward the viewer (core box() always draws +y/+x/top)
function boxV(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=1){
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
  ];
  return F.filter(([n]) => facing(n)).map(([n,p]) => shape(p, shade(n,m), w)).join('');
}
// text lying on any vertical face: U = reading direction in 3D (along the face, left-to-right as seen from outside)
const txOn = (x,y,z,U,str,size,col=INK,weight=700,extra='letter-spacing=".04em"') => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(...U), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${FONT_HEAD}" font-weight="${weight}" ${extra}>${str}</text>`; };
const txBack  = (y,z,str,size,col,weight) => txOn(-.4,y,z,[0,1,0],str,size,col,weight);     // back face x = 0
const txRight = (x,z,str,size,col,weight) => txOn(x,-.4,z,[-1,0,0],str,size,col,weight);    // right side y = 0

/* ---------- products ---------- */
const zRing = (x,y,z,r) => on(PZ(z), ellUV(x,y,r,r));
function can(x,y,z,col){
  const m=matOf(col), a=zRing(x,y,z,5.6), b=zRing(x,y,z+2,6.5), c=zRing(x,y,z+17,6.5), d=zRing(x,y,z+20,5.6);
  return loft(a,b,n=>toneI(n,METAL)) + loft(b,c,n=>toneI(n,m)) + loft(c,d,n=>toneI(n,METAL))
    + fill(pd(d),METAL.l) + ink(pd(d),.9) + ink(pd(zRing(x+1.5,y,z+20.1,1.6)),.7)
    + `<path d="${pd([[x+5.5,y-2.5,z+4],[x+5.5,y-2.5,z+15]],false)}" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>`
    + hullInk([...a,...b,...c,...d],1.2);
}
function bottle(x,y,z,col){
  const m=matOf(col), cap=matOf(mix(col,'#000000',.25));
  const r0=zRing(x,y,z,6), r1=zRing(x,y,z+15,6), r2=zRing(x,y,z+20,2.6), r3=zRing(x,y,z+23,2.6), r4=zRing(x,y,z+23,3), r5=zRing(x,y,z+26,3);
  return loft(r0,r1,n=>toneI(n,m)) + loft(r1,r2,n=>toneI(n,CLEAR)) + loft(r2,r3,n=>toneI(n,CLEAR))
    + loft(r4,r5,n=>toneI(n,cap)) + fill(pd(r5),cap.l) + ink(pd(r5),.8)
    + ink(pd([[x+6,y-3,z+4],[x+6,y-3,z+12]],false),.5).replace(INK,'#ffffff')
    + hullInk([...r0,...r1,...r2,...r3],1.2) + ink(sp(hull([...r4,...r5].map(p=>P(...p)))),.9);
}
function snack(x,y,z,col){
  const m=matOf(col);
  return boxV(x-3.5,y-7,z,x+3.5,y+7,z+21,m,toneI,1.1)
    + shape(on(PX(x+3.6),rectUV(y-5.5,z+7,y+5.5,z+13)),'#fbf7ea',.8);
}
const ITEM = { can, bottle, snack };
// the wire spiral a column of products sits in: a helix along x around them. Turning it once pushes every product
// forward one slot (adv = how far it has turned, in units of x). Split into short pieces so each sorts by depth with
// the products: the near half of each loop draws in front of them, the far half behind.
const COIL_R = 7.2;
function coil(y, zs, adv){
  const zc = zs + COIL_R + .3, parts = [], N = 10;
  const at = x => { const a = 2*Math.PI*(x - ITEM_X - adv)/ITEM_STEP + Math.PI;   // at a product's centre the wire is underneath it
    return [x, y + COIL_R*Math.sin(a), zc + COIL_R*Math.cos(a)]; };
  for (let x0 = T+3; x0 < SHELF_X-1; x0 += ITEM_STEP/N){
    const x1 = Math.min(SHELF_X-1, x0 + ITEM_STEP/N), pts = [at(x0), at((x0+x1)/2), at(x1)];
    parts.push({ at: pts[1], svg: `<path d="${pd(pts,false)}" fill="none" stroke="#8b979d" stroke-width="1" stroke-linecap="round"/>` });
  }
  return parts;
}
// the same products lying in the pickup tray, centred on y = yc (dx moves them toward the viewer as they're lifted out)
function lying(kind,col,yc,dx=0,dz=0){
  const m=matOf(col), x=W-9+dx;
  if (kind === 'snack') return boxV(W-15+dx,yc-11,14+dz,W-4+dx,yc+11,18+dz,m,toneI,1.1);
  const r = kind==='can' ? 6.5 : 6, h = kind==='can' ? 10 : 14, y0 = yc-h, y1 = yc+h, z = 14+r+dz;
  const A=on(PY(y0),ellUV(x,z,r,r)), B=on(PY(y1),ellUV(x,z,r,r));
  const capM = kind==='can' ? METAL : matOf(mix(col,'#000000',.25));
  const [E, n] = facing([0,1,0]) ? [B,[0,1,0]] : [A,[0,-1,0]];       // the end cap toward the viewer
  return loft(A,B,n=>toneI(n,m)) + fill(pd(E),toneI(n,capM)) + ink(pd(E),1) + hullInk([...A,...B],1.2);
}


/* ---------- state ---------- */
// flying: coins on their way into the slot (0..1 each); drop: a product being vended; take: the drink being lifted
// out; chg: change dropping into the cup; msg/msgN: a short note on the machine's own screen
const st = { credit:0, returned:0, sel:'', msg:'', msgN:0, drop:null, tray:null, take:null, got:'', chg:null, flying:[],
             press:null, flap:0, flapTarget:0, stock: ROWS.map(() => COL_Y.map(() => 3)) };

/* ---------- coins in the return cup ---------- */
const COIN = { l:'#f0d27a', m:'#d2ad4a', d:'#9a7a2a' };
const COIN_SPOTS = [[-3.4,21],[-4.6,16.5],[-4.2,25.6],[-2.2,17.8],[-2.4,24.4],[-5.6,20.8]];
// coins from index `from` on are still falling: drawn `drop` units higher, coming down the chute at the back of the cup
function coins(n, from=n, drop=0){
  const pts = [];
  for (let i=0; i<Math.min(n,18); i++){ const [dx,y] = COIN_SPOTS[i % 6]; pts.push([W+dx, y, CUP[1] + .1 + Math.floor(i/6)*1.1 + (i >= from ? drop : 0)]); }
  pts.sort((a,b) => (a[2]-b[2]) || (depthOf([a[0],a[1],0])-depthOf([b[0],b[1],0])));
  let s = '';
  for (const [x,y,z] of pts){
    const A = on(PZ(z), ellUV(x,y,2.6,2.6,16)), B = on(PZ(z+.9), ellUV(x,y,2.6,2.6,16));
    s += loft(A,B,n=>toneI(n,COIN)) + fill(pd(B),COIN.l) + ink(sp(hull([...A,...B].map(p=>P(...p)))),.7) + ink(pd(on(PZ(z+.95),ellUV(x,y,1.5,1.5,12))),.4);
  }
  return s;
}
// a coin on its way into the slot (t 0..1): held on edge, it comes in from the customer's side and slides through the
// slit. The part already through the front (x < W + .5) is cut off, so it disappears into the machine.
const SLOT = [21.2, 106];               // the slit's centre (y, z) on the coin plate
function flyingCoin(t){
  const e = ease(Math.min(1, t)), cx = W + 26 - 30*e, r = 3.1, xMin = W + .5;
  const disc = ellUV(cx, SLOT[1], r, r, 20), cut = [];
  disc.forEach((p, i) => { const q = disc[(i+1) % disc.length];        // keep the part in front of the face
    if (p[0] >= xMin) cut.push(p);
    if ((p[0] >= xMin) !== (q[0] >= xMin)){ const k = (xMin - p[0])/(q[0] - p[0]); cut.push([xMin, p[1] + k*(q[1]-p[1])]); } });
  if (cut.length < 3) return '';
  const near = on(PY(SLOT[0] + .5), cut), op = Math.min(1, t/.2);
  return `<g opacity="${op.toFixed(2)}">${fill(pd(on(PY(SLOT[0] - .5), cut)), COIN.d)}${shape(near, COIN.l, .8)}`
    + (cx - 1.8 > xMin ? ink(pd(on(PY(SLOT[0] + .55), ellUV(cx, SLOT[1], 1.8, 1.8, 14))), .4) : '') + `</g>`;
}

/* ---------- pickup door: a slab hinged along its bottom edge, drops open toward the viewer ---------- */
const DOOR_MAT = { l:'#55504a', m:'#3d3935', d:'#272421' };   // smoked acrylic: faces see-through, edges solid
const DOOR_MAX = 84;                           // degrees when fully open (almost flat)
function pickupDoor(){
  const th = ease(st.flap) * DOOR_MAX * Math.PI/180;
  const y0 = TRAY[0]+1, y1 = TRAY[2]-1, len = TRAY[3]-TRAY[1]-1.5, t = 2, hx = W-.5, hz = TRAY[1];
  const up = [Math.sin(th),0,Math.cos(th)], out = [Math.cos(th),0,-Math.sin(th)];   // along the door (hinge -> top edge), outward normal
  const Q = (sAlong, w, y) => [hx + sAlong*up[0] - w*out[0], y, hz + sAlong*up[2] - w*out[2]];
  const faces = [
    { n: out,            p: [Q(0,0,y0),Q(0,0,y1),Q(len,0,y1),Q(len,0,y0)], clear: true },
    { n: out.map(v=>-v), p: [Q(0,t,y0),Q(0,t,y1),Q(len,t,y1),Q(len,t,y0)], clear: true },
    { n: up,             p: [Q(len,0,y0),Q(len,0,y1),Q(len,t,y1),Q(len,t,y0)] },
    { n: up.map(v=>-v),  p: [Q(0,0,y0),Q(0,0,y1),Q(0,t,y1),Q(0,t,y0)] },
    { n: [0,1,0],        p: [Q(0,0,y1),Q(len,0,y1),Q(len,t,y1),Q(0,t,y1)] },
  ];
  let s = '';
  for (const fc of faces) if (vis(fc.n))
    s += fc.clear ? fill(pd(fc.p), tone(fc.n, DOOR_MAT), 'fill-opacity=".34"') + ink(pd(fc.p),1.1) : shape(fc.p, tone(fc.n, DOOR_MAT), 1.1);
  if (vis(out)){
    s += fill(pd([Q(len*.15,-.1,y0+10),Q(len*.15,-.1,y0+18),Q(len*.85,-.1,y0+34),Q(len*.85,-.1,y0+26)]), '#ffffff', 'opacity=".28"');   // glint
    const yc = (y0+y1)/2;
    s += shape([Q(len-3.2,-.1,yc-16),Q(len-3.2,-.1,yc+16),Q(len-1.3,-.1,yc+16),Q(len-1.3,-.1,yc-16)], DOOR_MAT.d, .9);   // finger grip
    const o = P(...Q(len*.66,-.15,yc));
    s += `<text transform="${txM(o, Dv(0,-1,0), Dv(-up[0],0,-up[2]))}" font-size="4.6" fill="#e9e3d3" text-anchor="middle" dominant-baseline="middle" font-family="${FONT_HEAD}" font-weight="800" letter-spacing=".25em">PULL</text>`;
  }
  s += ink(pd([[hx,y0-1,hz],[hx,y1+1,hz]],false),1.8);   // hinge
  return `<g data-act="flap">${s}</g>`;
}

/* ---------- scene ---------- */
const OUT = rrUV(0,0,D,H,R), IN = rrUV(T,T,D-T,H-T,R-T);
const money = v => '$' + v.toFixed(2);

function screenLines(){
  if (st.msg) return st.msg.split('|');
  if (st.drop) return ['VENDING', st.drop.code];
  if (st.tray) return ['TAKE', 'ITEM'];
  if (st.sel) return ['SELECT', st.sel + '_'];
  return st.credit > 0 ? ['CREDIT', money(st.credit)] : ['INSERT', 'COIN'];
}

function scene(){
  const m = PALS[st.pal];
  // which faces of the cabinet are toward the viewer in the current turn
  const FF = facing([1,0,0]), BF = facing([-1,0,0]), LF = facing([0,1,0]), RF = facing([0,-1,0]);
  let s = '';

  // cast shadow
  s += castShadow([...on(PX(0),OUT), ...on(PX(W),OUT)]);

  // parts on hidden faces that stick out past the body go first, so the body covers them
  if (!FF) s += pickupDoor();
  if (!BF) s += powerCord();

  // front: openings, front face, everything mounted on it (only when the front is toward the viewer)
  if (FF) s += frontAssembly(m);

  // outer shell + side details
  s += loft(on(PX(0),OUT), on(PX(W),OUT), n=>tone(n,m));
  if (LF) s += leftSide(m);
  if (RF) s += rightSide(m);
  if (BF) s += backPanel(m);

  // silhouette
  if (FF) s += ink(pd(on(PX(W),OUT)),2.2);
  if (BF) s += ink(pd(on(PX(0),OUT)),2.2);
  s += hullInk([...on(PX(0),OUT), ...on(PX(W),OUT)], 2.8);
  if (BF) s += powerCord();            // the cord lies on the viewer's side of the back panel

  for (const c of st.flying) s += flyingCoin(c.t);   // after the shell: the coin is in front of it until it goes in

  // labels on the working parts, pills out in the empty paper to the right of the machine
  if (FF){
    const dr = st.drop;
    s += tag([W, SLOT[0], SLOT[1]], 76, -44, 'COIN SLOT', st.flying.length > 0);
    s += tag([W, 21, 130], 76, -54, 'KEYPAD', !!st.sel || !!st.press);
    s += tag([ITEM_X+ITEM_STEP/2, COL_Y[3], ROWS[3].s+2*COIL_R+.3], 104, -59, 'SPIRAL', !!dr && dr.h < DROP.turn);   // along the gap over RET
    s += tag([W, 21, 70], 70, 34, 'COIN CUP', !!st.chg);
    s += tag([W, 54, 26], 68, 70, 'PICKUP TRAY', !!st.tray || !!st.take);
  }
  return s;
}

function frontAssembly(m){
  let s = '';
  const LW = facing([0,1,0]);          // which side wall of an opening we look at: y0-wall (view 0) or y1-wall (view 3)
  const win = rectUV(WIN[0],WIN[1],WIN[2],WIN[3]), tray = rectUV(TRAY[0],TRAY[1],TRAY[2],TRAY[3]);
  s += `<clipPath id="cWin"><path d="${pd(on(PX(W),win))}"/></clipPath><clipPath id="cTray"><path d="${pd(on(PX(W),tray))}"/></clipPath>`;

  // interior behind the glass: lit cabinet, shelves bottom-up, products back-to-front
  let it = fill(pd(on(PX(T),IN)), '#e8eef0');
  it += loft(on(PX(T),IN), on(PX(W-3),IN), n => n[2]>.7 ? '#d3dbde' : '#dfe7e9', true);
  it += fill(pd(on(PY(LW ? T+.2 : D-T-.2),rectUV(T+10,60,W-10,206))), '#ffffff', 'opacity=".8"');   // light strip on the visible side wall
  // the product being vended: on the shelf while its spiral turns (it is the front one of its column, one slot ahead),
  // then falling in the gap between the shelf fronts and the glass
  const dr = st.drop, turned = dr ? ease(Math.min(1, dr.h/DROP.turn)) * ITEM_STEP : 0;
  const falling = dr && dr.h > DROP.turn, fallK = falling ? Math.min(1, (dr.h - DROP.turn)/DROP.fall) : 0;
  for (let r = ROWS.length-1; r >= 0; r--){
    const row = ROWS[r], z = row.s;
    it += shape([[T,T,z],[SHELF_X,T,z],[SHELF_X,D-T,z],[T,D-T,z]], '#cfd6d8', 0);
    const parts = [];
    COL_Y.forEach((y,c) => {
      const here = dr && dr.r === r && dr.c === c, adv = here ? turned : 0;
      parts.push(...coil(y, z, adv));
      for (let k = st.stock[r][c]-1; k >= 0; k--){ const x = ITEM_X - (here ? k+1 : k)*ITEM_STEP + adv;
        parts.push({ at:[x,y,z+10], svg:`<g data-act="item" data-r="${r}" data-c="${c}">${ITEM[row.kind](x,y,z,row.cols[c])}</g>` }); }
      if (here && !falling) parts.push({ at:[ITEM_X+adv,y,z+10], svg:ITEM[row.kind](ITEM_X+adv,y,z,row.cols[c]) });
    });
    it += byDepth(parts);
    it += shape([[SHELF_X,T,z-3],[SHELF_X,D-T,z-3],[SHELF_X,D-T,z],[SHELF_X,T,z]], '#a9b1b4', 1);
    COL_Y.forEach((y,c) => {
      it += shape(on(PX(SHELF_X+.2),rectUV(y-5,z-2.7,y+5,z-.3)), st.stock[r][c] ? '#fffdf5' : '#f3c6bd', .6);
      it += tx(SHELF_X+.3, y, z-.9, row.code+(c+1), 2.1, INK);
    });
  }
  if (falling && fallK < 1){                      // nearer than every shelf front, so it draws over all of them
    const row = ROWS[dr.r], x = SHELF_X + (FALL_X - SHELF_X)*Math.min(1, fallK*4);
    it += ITEM[row.kind](x, COL_Y[dr.c] + (trayY(dr.c) - COL_Y[dr.c])*fallK, row.s - (row.s - 14)*fallK*fallK, row.cols[dr.c]);
  }
  s += `<g clip-path="url(#cWin)">${it}</g>`;

  // glass: tint, streaks, window reveal
  const GX = PX(W-2.9), wy = LW ? WIN[0] : WIN[2];
  s += `<g pointer-events="none">${fill(pd(on(GX,win)),'#cfe9f0','opacity=".2"')}`
     + fill(pd(on(GX,[[52,62],[66,62],[102,196],[88,196]])),'#ffffff','opacity=".38"')
     + fill(pd(on(GX,[[72,62],[77,62],[113,196],[108,196]])),'#ffffff','opacity=".38"') + `</g>`;
  s += face(pd([[W-3,wy,WIN[1]],[W,wy,WIN[1]],[W,wy,WIN[3]],[W-3,wy,WIN[3]]]), tone([0,LW?1:-1,0],m));
  s += face(pd([[W-3,WIN[0],WIN[1]],[W,WIN[0],WIN[1]],[W,WIN[2],WIN[1]],[W-3,WIN[2],WIN[1]]]), tone([0,0,1],m));

  // pickup tray: dark cavity + product (the door is drawn after the front face)
  const tb = W-18, ty = LW ? TRAY[0] : TRAY[2];
  let tr = shape(on(PX(tb),rectUV(TRAY[0],14,TRAY[2],TRAY[3])), m.d, 0);
  tr += face(pd([[tb,ty,14],[W,ty,14],[W,ty,TRAY[3]],[tb,ty,TRAY[3]]]), mix(m.d,'#000000',.25));
  tr += face(pd([[tb,TRAY[0],14],[W,TRAY[0],14],[W,TRAY[2],14],[tb,TRAY[2],14]]), mix(m.d,'#ffffff',.12));
  const tk = st.take, lifted = tk && tk.h > TAKE.open;
  if (st.tray) tr += lying(st.tray.kind, st.tray.col, st.tray.yc);
  else if (tk && !lifted) tr += lying(tk.kind, tk.col, tk.yc);
  s += `<g clip-path="url(#cTray)" data-act="tray">${fill(pd(on(PX(W),tray)),'transparent')}${tr}</g>`;

  // coin-return cup: small cavity with the refunded coins lying in it
  const cup = rectUV(CUP[0],CUP[1],CUP[2],CUP[3]), cb = W-8, cy = LW ? CUP[0] : CUP[2];
  s += `<clipPath id="cCup"><path d="${pd(on(PX(W),cup))}"/></clipPath>`;
  let cp = shape(on(PX(cb),cup), mix(METAL.d,'#000000',.45), 0);
  cp += face(pd([[cb,cy,CUP[1]],[W,cy,CUP[1]],[W,cy,CUP[3]],[cb,cy,CUP[3]]]), mix(METAL.d,'#000000',.3));
  cp += face(pd([[cb,CUP[0],CUP[1]],[W,CUP[0],CUP[1]],[W,CUP[2],CUP[1]],[cb,CUP[2],CUP[1]]]), METAL.m);
  const nC = Math.round(st.returned / .5);
  cp += st.chg ? coins(nC, st.chg.from, 14*(1 - Math.min(1, st.chg.t)**2)) : coins(nC);
  s += `<g clip-path="url(#cCup)" data-act="cup">${fill(pd(on(PX(W),cup)),'transparent')}${cp}</g>`;

  // front face with its openings
  const X = PX(W);
  s += `<path d="${pd(on(X,OUT))}${pd(on(X,win))}${pd(on(X,tray))}${pd(on(X,cup))}" fill="${tone([1,0,0],m)}" fill-rule="evenodd"/>`;
  s += ink(pd(on(X,win)),1.8) + ink(pd(on(X,tray)),1.6) + ink(pd(on(X,cup)),1.4);
  s += shape(on(PX(W+.3),rrUV(10,62,32,82,3)), 'none', 1);   // metal bezel line
  s += ink(pd([[W,36,8],[W,36,200]],false),1) + ink(pd([[W,36,200],[W,124,200]],false),1);
  s += pickupDoor();
  if (lifted){                                    // the drink comes up out of the tray, over the open door, to you
    const k = Math.min(1, (tk.h - TAKE.open)/TAKE.lift);
    if (k < 1) s += `<g opacity="${(1 - k*k).toFixed(2)}">${lying(tk.kind, tk.col, tk.yc, 22*ease(k), 16*ease(k))}</g>`;
  }

  // header sign
  const F = PX(W+.3);
  s += shape(on(F,rrUV(8,204,122,224,4)), '#fff4d6', 1.4);
  s += tx(W+.4, 65, 211, 'DRINKS · SNACKS', 8.4, m.d, 800);

  // control column: screen, keypad, coin slot, return
  s += shape(on(F,rrUV(9,164,33,186,2.5)), '#1d2a26', 1.3);
  const [l1,l2] = screenLines();
  s += tx(W+.4, 21, 177.5, l1, 3.9, '#8af0ae', 700, FONT_MONO) + tx(W+.4, 21, 169.5, l2, 3.9, '#8af0ae', 700, FONT_MONO);
  const keys = [];
  ['A','B','C','D'].forEach((k,i) => keys.push({ k, y:26.5, z:152-i*11 }));
  ['1','2','3','4'].forEach((k,i) => keys.push({ k, y:15.5, z:152-i*11 }));
  for (const key of keys){
    const down = st.press === key.k;
    let b = shape(on(F,rrUV(key.y-4.6,key.z,key.y+4.6,key.z+8,2)), down ? METAL.d : METAL.l, 1.1);
    b += tx(W+.5, key.y, key.z+2.4, key.k, 4.4, INK, 700);
    s += `<g data-act="key" data-k="${key.k}">${b}</g>`;
  }
  s += `<g data-act="coin">${shape(on(F,rrUV(11,100,31,112,2.5)), METAL.m, 1.2)}${shape(on(PX(W+.5),rrUV(20,102,22.4,110,1)), '#26231f', .6)}${tx(W+.5, 26.5, 104, 'c', 4, INK)}</g>`;
  s += `<g data-act="ret">${shape(on(F,ellUV(21,92,3.6,3.6)), METAL.l, 1.1)}${tx(W+.5, 21, 90.6, 'RET', 2.4, INK)}</g>`;
  return s;
}

// a lighter take on the body palette for the side decals
const decalPal = m => ({ l:mix(m.l,'#ffffff',.15), m:mix(m.m,'#ffffff',.12), d:mix(m.d,'#ffffff',.1) });
// decal lettering takes the face colour; on a sunlit face that would vanish into the lighter panel, so go a step darker
const decalInk = (n,m) => { const c = tone(n,m); return c === m.l ? mix(m.m,'#000000',.12) : c; };

// +y side (viewer-left in the front view): low vents and the COLD decal
function leftSide(m){
  let s = '', v = '';
  for (const z of [14,19,24,29]) v += pd([[18,D+.2,z],[W-18,D+.2,z]],false);
  s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>`;
  s += shape(on(PY(D+.2),rrUV(20,150,W-20,200,6)), tone([0,1,0],decalPal(m)), 1.2);
  s += `<text transform="${txM(P(W/2,D+.3,170), Dv(1,0,0), Dv(0,0,-1))}" font-size="12" fill="${decalInk([0,1,0],m)}" text-anchor="middle" font-family="${FONT_HEAD}" font-weight="800">COLD</text>`;
  return s;
}

// −y side: matching vents, a SNACKS decal, a round 24h badge and an asset tag
function rightSide(m){
  const n = [0,-1,0], Y = PY(-.2);
  let s = '', v = '';
  for (const z of [14,19,24,29]) v += pd([[18,-.2,z],[W-18,-.2,z]],false);
  s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>`;
  s += shape(on(Y,rrUV(20,150,W-20,200,6)), tone(n,decalPal(m)), 1.2);
  s += `<text transform="${txM(P(W/2,-.3,170), Dv(-1,0,0), Dv(0,0,-1))}" font-size="10.5" fill="${decalInk(n,m)}" text-anchor="middle" font-family="${FONT_HEAD}" font-weight="800">SNACKS</text>`;
  s += shape(on(Y,ellUV(W/2,118,11,11,28)), '#fff4d6', 1.2);
  s += ink(pd(on(PY(-.3),ellUV(W/2,118,8.6,8.6,28))), .7);
  s += txRight(W/2, 117.5, '24h', 6.4, m.d, 800) + txRight(W/2, 112.2, 'OPEN', 2.6, m.d, 800);
  s += shape(on(Y,rrUV(58,62,76,71,1)), METAL.l, .9) + txRight(67, 65.4, 'No. 117', 2.6, INK, 700);
  return s;
}

// back (−x): service panel with screws, fan grille, louvre, warning sticker, rating plate, cord grommet
function backPanel(m){
  const n = [-1,0,0], B = PX(-.3), bt = tone(n,m);
  let s = shape(on(PX(0),OUT), bt, 0);
  s += ink(pd(on(B,rrUV(12,16,118,220,4))), 1.1);                                  // service panel seam
  for (const [y,z] of [[17,21],[65,21],[113,21],[17,118],[113,118],[17,215],[65,215],[113,215]])
    s += shape(on(PX(-.4),ellUV(y,z,1.7,1.7,12)), METAL.l, .8) + line([[-.5,y-1.1,z+.5],[-.5,y+1.1,z-.5]], .6);
  // round fan grille near the top (the compressor exhausts here)
  const fc = [65,176];
  s += shape(on(B,ellUV(...fc,23,23,32)), mix(m.d,'#000000',.35), 1.4);
  let g = '';
  for (const r of [19,14.5,10]) g += pd(on(PX(-.5),ellUV(...fc,r,r,32)));
  for (const a of [45,135,225,315]){ const c = Math.cos(a*Math.PI/180), d = Math.sin(a*Math.PI/180);
    g += pd([[-.5,fc[0]+5*c,fc[1]+5*d],[-.5,fc[0]+22*c,fc[1]+22*d]],false); }
  s += `<path d="${g}" fill="none" stroke="${METAL.m}" stroke-width="1.3" stroke-linecap="round"/>`;
  s += shape(on(PX(-.6),ellUV(...fc,4.4,4.4,16)), METAL.l, .9);
  // louvred intake low down
  s += shape(on(B,rectUV(28,36,102,66)), mix(m.d,'#000000',.35), 0);
  for (let z = 39; z < 64; z += 5) s += shape(on(PX(-.4),rectUV(29,z,101,z+2.4)), mix(bt,'#ffffff',.06), .6);
  s += ink(pd(on(B,rectUV(28,36,102,66))), 1.2);
  // warning sticker + rating plate
  s += shape(on(PX(-.4),rrUV(20,112,72,142,2)), '#f6d64a', 1);
  s += ink(pd(on(PX(-.45),rrUV(22,114,70,140,1.4))), .6);
  s += txBack(46, 131.2, 'KEEP 10 cm', 4.4, INK, 800) + txBack(46, 124.6, 'FROM WALL', 4.4, INK, 800) + txBack(46, 118.2, '↔ VENTILATION', 2.5, INK, 700);
  s += shape(on(PX(-.4),rrUV(80,110,114,142,1.5)), METAL.l, .9);
  s += txBack(97, 135.5, 'CF-01 VENDO', 3.1, INK, 800) + txBack(97, 129.5, 'SN 0423-1187', 2.4, INK, 700)
     + txBack(97, 124.5, '230V~ 50Hz', 2.4, INK, 700) + txBack(97, 119.5, '4.2 A · R600a', 2.4, INK, 700)
     + line([[-.45,82,127.8],[-.45,112,127.8]], .4);
  // cord grommet
  s += shape(on(PX(-.4),ellUV(92,30,3.4,3.4,14)), DARK.m, .9);
  return s;
}

// mains cable: out of the grommet on the back, down to the floor, plug lying on the ground behind the machine
function powerCord(){
  const path = [[-.5,92,30],[-2.6,92,29],[-3.8,92,26],[-4,92,8],[-4.6,91.6,2.4],[-6.5,90.6,.9],[-11,88.6,.9],[-17,85.4,.9],[-22,82,.9],[-25,80,.9]];
  const d = pd(path,false);
  let s = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<path d="${d}" fill="none" stroke="${DARK.l}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += boxV(-26.5,77.5,0,-25,82.5,3.4,DARK,toneI,.8);                 // strain relief
  s += boxV(-34,76,0,-26.5,84,5.6,DARK,toneI,1);                      // plug body
  for (const y of [78.2,81.8]) s += line([[-34,y,2.8],[-38.5,y,2.8]], 1.6) + `<path d="${pd([[-34,y,2.8],[-38.5,y,2.8]],false)}" stroke="${METAL.l}" stroke-width=".6" stroke-linecap="round"/>`;
  return s;
}


/* ---------- behaviour ---------- */
let ui;
const render = () => ui.render();
// the caption under the figure, one plain sentence per phase of the real process. A caption the figure replaces on its
// own (vend, take) holds its phase for READ_S of itself, so rewording a caption re-times its phase.
const CAP = {
  idle:    () => 'Insert coins to start. The machine counts every coin.',
  coin:    c => `The machine checks each coin's size and metal, then adds it to your credit: ${c}.`,
  vend:    code => `The spiral behind ${code} turns once and pushes the front drink off the shelf.`,
  landed:  code => `${code} dropped into the pickup tray. Take your drink.`,
  take:    code => `You pull the pickup door down and lift out ${code}.`,
  left:    (code, c) => `You have your ${code}. Press Return change to get your ${c} back.`,
  change:  c => `Your ${c} change drops down a chute into the coin cup.`,
  done:    code => `You have your ${code}. The machine is ready for the next customer.`,
};
const DROP = { turn:1.0, fall:.55 };          // seconds: the spiral's turn, then the fall into the tray
const TAKE = { open:.55, lift:.7, shut:.55 }; // seconds: door down, drink out, door falls shut at the end of the phase
const captionText = st => st.take ? CAP.take(st.take.code)
    : st.drop ? CAP.vend(st.drop.code)
    : st.tray ? CAP.landed(st.tray.code)
    : st.returned > 0 ? CAP.change(money(st.returned))
    : st.got && st.credit > 0 ? CAP.left(st.got, money(st.credit))
    : st.got && !st.flying.length ? CAP.done(st.got)
    : st.credit > 0 || st.flying.length ? CAP.coin(money(st.credit)) : CAP.idle();

// a short note on the machine's own screen ("SOLD OUT"): part of the state, cleared by ui.after so Back and Next
// handle it like the rest of the step. It doesn't render: the press or animation that calls it does, and a render from
// inside Next's skip would count as a caption shown too briefly
const flash = (text, sec=1.4) => { st.msg = text; const n = ++st.msgN; ui.after(sec, () => { if (st.msgN === n) st.msg = ''; }); };
// a key lights up for 160 ms when pressed: purely cosmetic, so a plain timer is fine
let pressTimer = 0;
const press = k => { st.press = k; clearTimeout(pressTimer); pressTimer = setTimeout(() => { st.press = null; render(); }, 160); };

function vend(r, c){
  const row = ROWS[r], code = row.code + (c+1);
  if (st.drop) return ui.flash('Wait for this drink to drop');
  if (st.tray) return flash('TAKE|ITEM');
  if (!st.stock[r][c]) return flash('SOLD|OUT');
  if (st.credit < row.price - 1e-9) return flash('INSERT|' + money(row.price - st.credit));
  st.credit -= row.price; st.stock[r][c]--; st.sel = ''; st.got = '';
  st.drop = { r, c, code, h:0 };
  const hold = READ_S(CAP.vend(code));                   // the drink lands early; the phase lasts until its caption is read
  ui.animate(dt => {
    st.drop.h += dt;
    if (!st.tray && st.drop.h >= DROP.turn + DROP.fall) st.tray = { kind:row.kind, col:row.cols[c], code, yc:trayY(c) };
    if (st.drop.h >= hold){ st.drop = null; return false; }
    return true;
  });
}
function key(k){
  press(k);
  if (/[A-D]/.test(k)){ st.sel = k; render(); return; }
  if (!st.sel){ flash('PICK|A-D'); return; }
  const r = 'ABCD'.indexOf(st.sel); st.sel = ''; vend(r, +k-1); render();
}
// a coin from your hand: it slides into the slot, and the machine counts it once it is inside
const coin = () => {
  if (st.credit + st.flying.length*.5 >= 5) return flash('MAX|$5.00');
  st.got = ''; const c = { t:0 }; st.flying.push(c);
  ui.animate(dt => {
    c.t += dt/.7;
    if (c.t < 1) return true;
    st.flying.splice(st.flying.indexOf(c), 1); st.credit += .5; return false;
  });
};
const refund = () => {
  st.sel = '';
  if (st.credit <= 0) return ui.flash('There is no credit to return');
  st.chg = { from: Math.round(st.returned/.5), t:0 };
  st.returned += st.credit; st.credit = 0; flash('COINS|BELOW');
  ui.animate(dt => { st.chg.t += dt/.45; if (st.chg.t < 1) return true; st.chg = null; return false; });
};
const takeCoins = () => {
  if (st.returned <= 0) return ui.flash('The coin cup is empty');
  if (st.chg) return ui.flash('Wait for the coins to land');
  const amt = st.returned; st.returned = 0; flash('THANK|YOU'); ui.flash(`Collected ${money(amt)}`);
};
// the door on its own (tap it): drops open or swings shut
function swing(target){
  if (st.flapTarget === target) return;
  st.flapTarget = target;
  ui.animate(dt => {
    const sg = Math.sign(st.flapTarget - st.flap); if (!sg) return false;
    st.flap += sg * dt/TAKE.open;
    if ((st.flapTarget - st.flap)*sg <= 0) st.flap = st.flapTarget;
    return st.flap !== st.flapTarget;
  });
}
const toggleFlap = () => st.take ? ui.flash('Wait: the door shuts on its own') : swing(st.flapTarget ? 0 : 1);
// Take your drink: one thing a person does. Pull the door down, lift the drink out; the door falls shut by itself.
function takeDrink(){
  if (st.take) return ui.flash('You are already taking it');
  if (!st.tray) return ui.flash(st.drop ? 'Wait for the drink to drop' : 'Nothing in the tray yet');
  const { kind, col, code, yc } = st.tray;
  st.take = { kind, col, code, yc, h:0 }; st.tray = null; st.flapTarget = 1;
  const f0 = st.flap, end = READ_S(CAP.take(code));
  ui.animate(dt => {
    const h = st.take.h += dt;
    st.flap = h < end - TAKE.shut ? Math.max(f0, Math.min(1, h/TAKE.open)) : Math.max(0, (end - h)/TAKE.shut);
    if (h < end) return true;
    st.flap = st.flapTarget = 0; st.got = code; st.take = null; flash('ENJOY|' + code); return false;
  });
}


ui = mountFigure({
  fig:'03', title:'Vending machine', hint:'insert a coin, punch a code or tap a product',
  size:[W,D,H], state:st,
  scene: () => scene(),
  caption: captionText,
  walk: ['Insert', 'Insert', 'Insert', 'Insert', 'Choose a drink>A1', 'Take your drink', 'Return change'],
  stats: st => [ { label:'Credit', value: money(st.credit) }, st.returned > 0 && { label:'Change in the cup', value: money(st.returned), small:true } ],
  buttonsLabel:'Machine',
  buttons:[
    { label:'Insert 50c', onClick: coin,
      predict:'The slot cannot see. How could the machine tell a real 50c coin from a metal washer?' },
    { label:'Choose a drink', choices: st => ROWS.flatMap((row,r) => COL_Y.map((_,c) => ({
        label:`${row.code}${c+1} ${money(row.price)}`,
        disabled: !!st.drop || !!st.tray || !st.stock[r][c] || st.credit < row.price - 1e-9,
        why: st.drop ? 'wait for this drink to drop' : st.tray ? 'take your drink out of the tray first'
           : !st.stock[r][c] ? `${row.code}${c+1} is sold out` : `insert ${money(row.price - st.credit)} more`,
        onClick: () => vend(r,c) }))),
      predict:'Your drink stands on a shelf behind the glass. How will the machine move just that one drink to you?' },
    { label:'Take your drink', onClick: takeDrink },
    { label:'Return change', onClick: refund,
      predict:'Your coins are inside the machine now. How will the money you did not spend get back to you?' },
    { label:'Take coins', onClick: takeCoins },
  ],
  acts:{
    key:  (st,a) => key(a.dataset.k),
    item: (st,a) => vend(+a.dataset.r, +a.dataset.c),
    coin, ret: refund, tray: takeDrink, flap: toggleFlap, cup: takeCoins,
  },
  params:(st,q) => {
    if (q.has('credit')) st.credit = +q.get('credit');
    if (q.get('flap') === '1') st.flap = st.flapTarget = 1;
    if (q.has('returned')) st.returned = +q.get('returned');
    const tq = /^([A-D])([1-4])$/.exec(q.get('tray') || '');
    if (tq){ const r = 'ABCD'.indexOf(tq[1]), c = +tq[2]-1, row = ROWS[r]; st.tray = { kind:row.kind, col:row.cols[c], code:tq[0], yc:trayY(c) }; }
  },
});
</script>
</body>
</html>
