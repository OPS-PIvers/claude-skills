<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bluetooth headphones</title>
</head>
<body>
<script src="core.js"></script>
<script>
/* A how-it-works figure. The real sequence: who presses what, and where the energy and the song are after each step:
   1 Charge      you plug the cable from the power strip into the     energy: strip → cable → battery (0 → 100 %);
                 ear cup, wait until it's full, and unplug it         the cable lies back on the desk by the strip
   2 Power on    you hold the button on the ear cup; the chip wakes,  energy: battery → chip
                 the light blinks, then stays blue (ready to pair)
   3 Pair        on the phone: it asks by radio, the headphones       a shared code: phone ↔ antenna
                 answer with their name, you tap it, they swap a code
   4 Play music  on the phone: phone → radio waves → antenna → chip   song: phone → air → chip → both speakers →
                 → wire in the headband → both speakers → your ears         air between the ear cups
   5 Turn off    you hold the button again: the chip sleeps and the   the phone is remembered for next time
                 link drops, but the pairing stays
   Take apart    the left ear cup comes apart along its axis, in the order the parts sit (cushion, speaker, shell,
                 battery, chip, antenna, cover): the song's path is antenna → chip → speaker → cushion → ear.
                 Apart, the song and the radio still run (power, pair, play, off); charging waits for the cup. */

/* ---------- geometry (x = depth, y = width, z = height; 1 unit ≈ 4 mm) ---------- */
const HP_W = 86, HP_D = 76, HP_H = 64;
const XC = 30, ZC = 13, RX = 10, RZ = 13;      // ear cups: oval, centred at (x, z) = (XC, ZC), axis along y
const BRD = [-6, -6, 86, 76, 3, 6];            // the desk board (top at z = 0)
const BAND_Z = 31, BAND_TOP = 61;              // where the headband leaves the yokes, and its highest point
const PH = [46, 23, 80, 40];                   // the phone lying on the desk: x0, y0, x1, y1
const STRIP = [52, 64, 80, 71, 3.5];           // the power strip: x0, y0, x1, y1, height
const USB = [56, 67.5, 3.5];                   // its USB port, on top
const A_PH = [47.2, 31.5, 1.9];                // the phone's antenna (top edge)

/* ---------- the captions, and how long each phase lasts: long enough to read its caption (READ_S) ---------- */
const CAP = {
  plugIn:'You plug the cable from the power strip into the ear cup.',
  fill:'Electricity flows from the power strip through the cable and is stored in the battery.',
  full:'The battery is full, so you unplug the cable. Now the battery powers everything.',
  power:'You hold the button, and the battery wakes up the chip, the brain of the headphones.',
  ask:'On the phone, you look for devices. The phone sends out radio waves, asking what is nearby.',
  answer:"The headphones' antenna hears it and answers with their name.",
  code:'You tap their name. They swap a secret code, so now they only talk to each other.',
  send:'You press play. The phone turns the song into numbers and sends them as radio waves.',
  chip:'The antenna catches the waves. The chip turns the numbers back into an electric signal.',
  wire:'A thin wire inside the headband carries the signal to the other ear cup.',
  sound:"Each speaker's magnet pushes a thin cone back and forth. The cone shakes the air, and that is sound.",
  off:'You hold the button again. The chip goes to sleep and stops listening for the phone.',
  // taken apart (the engine's own "out" caption says it is called an exploded view)
  xDead:'Radio in, sound out: antenna, chip, speaker, ear cushion. But the battery is empty.',
  xOff:'Radio in, sound out: antenna, chip, speaker, ear cushion. Turn them on to follow it.',
  xOn:'Radio in, sound out: antenna, chip, speaker, ear cushion. Pair the phone to start it.',
  xLink:'Radio in, sound out: antenna, chip, speaker, ear cushion. Play music to follow it.',
  xDone:'The antenna caught the song, the chip made it a signal, and the speaker played it.',
  xIn:'The parts slide back into the ear cup, and the cover closes it.',
};
const ends = keys => { let t = 0; return keys.map(k => t += READ_S(CAP[k])); };   // when each phase ends, in seconds
const CHARGE_E = ends(['plugIn', 'fill', 'full']), PAIR_E = ends(['ask', 'answer', 'code']), PLAY_E = ends(['send', 'chip', 'wire', 'sound']);
const PLAY_T = PLAY_E[3];
const stageOf = (E, t) => { let i = 0; while (i < E.length - 1 && t >= E[i]) i++; return i; };

const RED = '#ad2122', GOLD = '#c9a14a', SCREEN = '#141a33';
const PCB = { l:'#4a9a68', m:'#2f6b4a', d:'#1f4a33' };
const CABLE = { l:'#ffffff', m:'#e6eaf2', d:'#c3c9d6' };
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const cupRing = (y, dr = 0) => on(PY(y), ellUV(XC, ZC, RX - dr, RZ - dr, 28));
const rimX = dz => XC + RX * Math.sqrt(1 - (dz / RZ) ** 2);        // the cup's front edge at height ZC + dz
const sw = w => `style="stroke-width:${f(w)}"`, CAPS = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
// text lying on a horizontal surface (the phone screen), lines running down toward +x
const txZ = (x, y, z, str, size, col, weight = 600) => { const o = P(x, y, z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${FONT_HEAD}" font-weight="${weight}">${str}</text>`; };
function smooth3(pts, it = 3){
  for (let k = 0; k < it; k++){ const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i+1];
      o.push(a.map((v,j) => v*.75 + b[j]*.25), a.map((v,j) => v*.25 + b[j]*.75)); }
    o.push(pts[pts.length-1]); pts = o; }
  return pts;
}
function bandPts(){ const o = [];                // left cup → right cup, the way the wire inside runs
  for (let i = 0; i <= 24; i++){ const a = Math.PI * (1 - i/24); o.push([XC, 29 - 24.5*Math.cos(a), BAND_Z + (BAND_TOP - BAND_Z)*Math.sin(a)]); }
  return o; }

/* ---------- state helpers ---------- */
const busy = st => st.phase !== 'idle';
const chipOn = st => st.phase === 'play' && st.pt >= PLAY_E[0];
const wireOn = st => st.phase === 'play' && st.pt >= PLAY_E[1];
const soundOn = st => st.phase === 'play' && st.pt >= PLAY_E[2] && st.pt < PLAY_T - .2;
const batteryOn = st => st.phase === 'charge' || st.phase === 'power' || st.phase === 'play';
const chipWorking = st => st.phase === 'power' || st.phase === 'pair' || chipOn(st);
function ledColour(st){
  if (st.phase === 'charge') return st.batt >= 100 ? '#43c25c' : st.plug >= 1 ? '#e2483d' : null;
  if (st.phase === 'pair') return Math.floor(st.tk * 4) % 2 ? '#4aa3ff' : null;
  if (st.phase === 'power') return st.press < .5 && st.tk > .6 ? '#4aa3ff' : null;
  return st.on ? '#4aa3ff' : null;
}

/* ---------- pieces ---------- */
// sound: rings leaving a speaker into the space between the cups (dir = +1 from the right cup, -1 from the left)
function soundRings(st, y0, dir, span = 13.5){
  let s = '';
  for (let k = 0; k < 3; k++){
    const d = (st.tk * 7 + k * span / 3) % span, r = 4.5 + d * .35 * 13.5 / span, o = (1 - d / span) * .85;
    s += `<path d="${pd(on(PY(y0 + dir*d), ellUV(XC, ZC, r*.78, r, 24)))}" fill="none" stroke="${RED}" stroke-width="1.3" opacity="${o.toFixed(2)}"/>`;
  }
  return s;
}
// the right ear cup (far): shell, cushion, and the speaker seen through the cushion
function rightCup(st, m){
  let s = loft(cupRing(0), cupRing(9), n => tone(n, m)) + shape(cupRing(9), tone([0,1,0], m), 1.1);
  s += loft(cupRing(9, .6), cupRing(14, 1.3), n => toneI(n, DARK));
  const outer = cupRing(14, 1.3), hole = on(PY(14), ellUV(XC, ZC, 5.4, 8, 28));
  s += `<path d="${pd(outer)}${pd(hole)}" fill="${DARK.l}" fill-rule="evenodd"/>` + ink(pd(outer), 1);
  // the speaker (driver): a cone with a small cap that moves in and out with the sound
  const v = soundOn(st) ? .7 * Math.sin(st.tk * 38) : 0;
  let drv = fill(pd(hole), DARK.d) + shape(on(PY(12), ellUV(XC, ZC, 4.6, 4.6, 24)), '#5a5f6e', .7)
    + shape(on(PY(12.4 + v*.4), ellUV(XC, ZC, 3.3 + v*.15, 3.3 + v*.15, 20)), '#6c7180', .5)
    + shape(on(PY(12.8 + v), ellUV(XC, ZC, 1.6, 1.6, 16)), DARK.l, .6);
  s += clipTo(hole, drv) + fill(pd(hole), '#9aa3c0', 'opacity=".18"') + ink(pd(hole), 1.1);
  return s + hullInk([...cupRing(0), ...cupRing(9), ...cupRing(14, 1.3)], 2.4);
}
/* the left ear cup (near). Its parts, along its axis (y) from the ear outward, as built:
     ear cushion 44–49 · speaker (cone 47.6–50, coil and magnet to 52.2) · shell 49–56.5 (on the yoke, with the port,
     light and button) · battery 52.5–54.3 · chip board 54.5–55.9 · antenna board 55.4–55.9 · outer cover 56.5–58
   Take apart: the shell stays on the headband; the cushion and the speaker slide out on the ear side (−y), the rest
   out through the open side (+y), each by EXO[part] (eased by the engine's st.ex). */
const EXO = { cushion:-22, speaker:-13, battery:10, chip:20, antenna:29, cover:39 };
const exDy = (st, k) => exOff(st, [0, EXO[k], 0])[1];
const SH_Y = 56.5, MOUTH = y => on(PY(y), ellUV(XC, ZC, RX - 1.2, RZ - 1.2, 28));
const shiftY = (pts, dy) => pts.map(p => [p[0], p[1] + dy, p[2]]);
// the parts hidden in the cup fade in as it opens (like the microscope's inside())
const insideK = st => clamp01(((st.ex || 0) - .08) / .3);
const antOn = st => st.phase === 'pair' || (st.phase === 'play' && st.pt < PLAY_E[1]);
const COPPER = matOf('#c8793a'), PAPER = { l:'#f4f1ea', m:'#ddd8cc', d:'#b3ad9f' };
const antPos = st => [XC + .5, 55.95 + exDy(st, 'antenna'), ZC + 5];
const chipPos = st => [XC, 55.9 + exDy(st, 'chip'), ZC];
const spkPos = st => [XC, 52.2 + exDy(st, 'speaker'), ZC];
const cushPos = st => [XC, 49 + exDy(st, 'cushion'), ZC];

function cushionL(st){ const dy = exDy(st, 'cushion'), A = cupRing(44 + dy, 1.3), B = cupRing(49 + dy, .6);
  let s = loft(A, B, n => toneI(n, DARK));
  if (dy < -1){ const hole = on(PY(49 + dy), ellUV(XC, ZC, 5.4, 8, 28));     // its inner face, once it is off the shell
    s += `<path d="${pd(B)}${pd(hole)}" fill="${DARK.m}" fill-rule="evenodd"/>` + ink(pd(B), 1) + ink(pd(hole), 1); }
  return s + hullInk([...A, ...B], 2.2); }
// the speaker (driver), seen from the back: the paper cone, the copper coil at its tip, the magnet inside the coil
function speakerL(st){ const dy = exDy(st, 'speaker'), v = soundOn(st) ? .5 * Math.sin(st.tk * 38) : 0, y0 = 47.6 + dy;
  const ring = (y, r, n = 28) => on(PY(y), ellUV(XC, ZC, r, r, n));
  let s = shape(ring(y0 - .2, 7.9), DARK.m, .9) + fill(pd(ring(y0 - .15, 7.1)), DARK.d);      // the frame and the rubber edge
  s += loft(ring(y0 + v*.3, 7), ring(y0 + 2.4 + v, 2.9), n => toneI(n, PAPER));
  s += rod([XC, y0 + 1.8 + v, ZC], [XC, y0 + 3.6 + v, ZC], 3.1, COPPER, toneI, .8);        // the coil of thin wire
  for (let i = 1; i < 4; i++){ const yy = y0 + 2 + v + i * .45;                           // its windings
    s += `<path d="${pd(on(PY(yy), arcUV(XC, ZC, 3.1, -30, 160, 10)), false)}" fill="none" stroke="#8a4a1c" stroke-width=".5"/>`; }
  s += rod([XC, y0 + 2.6, ZC], [XC, y0 + 4.6, ZC], 2, DARK, toneI, .9) + shape(ring(y0 + 4.62, 1.5, 16), METAL.m, .6);  // magnet
  return s; }
function batteryL(st){ const y = 52.5 + exDy(st, 'battery');
  return box(XC - 6, y, ZC - 8, XC + 6, y + 1.8, ZC + 4, METAL, toneI, .9) + txY(XC, y + 1.85, ZC - 3.2, 'Li-ion', 2.4, INK, 600); }
function chipL(st){ const y = 54.5 + exDy(st, 'chip'), A = on(PY(y), ellUV(XC, ZC, 7.4, 10, 28)), B = on(PY(y + .7), ellUV(XC, ZC, 7.4, 10, 28));
  let s = loft(A, B, n => toneI(n, PCB)) + shape(B, PCB.m, .9);
  for (const [a, b] of [[[-2, 1.2], [-5.6, 1.2]], [[-2, -1.2], [-5, -4.5]], [[2, 1.4], [4.6, 5.5]], [[2, -1], [5.4, -1]], [[0, -2], [0, -7]]])
    s += `<path d="${pd(on(PY(y + .72), [[XC + a[0], ZC + a[1]], [XC + b[0], ZC + b[1]]]), false)}" ${CAPS} stroke="${GOLD}" stroke-width=".6"/>`;
  s += box(XC - 4.5, y + .7, ZC + 3.4, XC - 2.5, y + 1.1, ZC + 4.6, DARK, toneI, .5);
  s += box(XC - 2.2, y + .7, ZC - 2.2, XC + 2.2, y + 1.4, ZC + 2.2, DARK, toneI, .7);
  if (chipOn(st) || st.phase === 'pair' || st.phase === 'power'){ const [X,Y] = P(XC, y + 1.4, ZC);
    s += `<circle cx="${f(X)}" cy="${f(Y)}" r="3.4" fill="#ff8a7a" opacity="${(.3 + .2*Math.sin(st.tk*9)).toFixed(2)}"/>`; }
  return s; }
function antennaL(st){ const y = 55.4 + exDy(st, 'antenna'), on_ = antOn(st);
  let s = box(XC - 3, y, ZC + 2, XC + 4, y + .5, ZC + 8, PCB, toneI, .8);
  const zig = [[3,3],[3,7],[1.8,7],[1.8,3.6],[.6,3.6],[.6,7],[-.6,7],[-.6,3.6],[-1.8,3.6],[-1.8,7]].map(([u,v]) => [XC + u, y + .55, ZC + v]);
  return s + `<path d="${pd(zig, false)}" ${CAPS} stroke="${on_ ? '#ffd27a' : GOLD}" stroke-width="${on_ ? 1.2 : .85}"/>`; }
function coverL(st, m){ const y = SH_Y + exDy(st, 'cover'), A = cupRing(y), B = cupRing(y + 1.5);
  return loft(A, B, n => tone(n, m)) + shape(B, tone([0,1,0], m), 1.3)
    + ink(pd(on(PY(y + 1.52), ellUV(XC, ZC, RX - 2.6, RZ - 2.6, 28))), .7) + hullInk([...A, ...B], 2.2); }
// the shell stays on the yoke; with the cover off you see into it: the wall, and the back plate with the speaker's hole
function shellL(st, m){
  let s = loft(cupRing(49), cupRing(SH_Y), n => tone(n, m));
  const open = exDy(st, 'cover') > .05, outer = cupRing(SH_Y), mouth = MOUTH(SH_Y);
  if (open){
    s += `<path d="${pd(outer)}${pd(mouth)}" fill="${tone([0,1,0], m)}" fill-rule="evenodd"/>` + ink(pd(mouth), 1);
    s += clipTo(mouth, fill(pd(mouth), DARK.m) + fill(pd(on(PY(50), ellUV(XC, ZC, RX - 1.4, RZ - 1.4, 28))), DARK.l)
      + shape(on(PY(50.05), ellUV(XC, ZC, 4.2, 4.2, 20)), DARK.d, .7));
  }
  // on the front edge: the USB-C port, the light, the power button
  const xp = rimX(-5), xl = rimX(0), xb = rimX(5);
  s += shape(on(PX(xp + .1), rrUV(51.8, ZC - 5.8, 55.2, ZC - 4.2, .7)), '#1a1d24', .6);
  const led = ledColour(st);
  s += shape(on(PX(xl + .1), ellUV(53.5, ZC, .9, .9, 12)), led || '#555a68', .6);
  if (led){ const [X,Y] = P(xl + .5, 53.5, ZC); s += `<circle cx="${f(X)}" cy="${f(Y)}" r="3" fill="${led}" opacity=".35"/>`; }
  s += act('power', cylX(xb, xb + 1.5 - st.press, 53.5, ZC + 5, 1.7, DARK, toneI, .9));
  return s + ink(pd(outer), 1.1) + hullInk([...cupRing(49), ...outer], 2.4);
}
// the whole left cup, far to near along its axis. A part still inside the shell shows only through its open side.
function leftCup(st, m){
  const ia = insideK(st), inside = svg => ia > 0 ? `<g opacity="${ia.toFixed(2)}">${svg}</g>` : '';
  const thru = (yBack, svg) => yBack < SH_Y ? clipTo(MOUTH(SH_Y), svg) : svg;
  let s = cushionL(st);
  // apart, the sound leaves the speaker's cone toward the cushion (and on to your ear)
  if (soundOn(st) && ia >= .5){ const ym = 47.6 + exDy(st, 'speaker'), yc = 49 + exDy(st, 'cushion');
    s += soundRings(st, ym - .3, -1, Math.max(3, ym - yc)); }
  s += inside(speakerL(st)) + shellL(st, m);
  if (ia > 0) s += inside(thru(52.5 + exDy(st, 'battery'), batteryL(st)) + thru(54.5 + exDy(st, 'chip'), chipL(st))
    + thru(55.4 + exDy(st, 'antenna'), antennaL(st)));
  s += coverL(st, m);
  // together: the seam where the cover fits on (only the half of it that faces us)
  if (exDy(st, 'cover') < .05){ const seam = []; for (let i = 0; i <= 16; i++){ const t = (-50 + 178 * i / 16) * Math.PI / 180;
      seam.push([XC + RX * Math.cos(t), SH_Y, ZC + RZ * Math.sin(t)]); }
    s += line(seam, .8); }
  return s;
}
function headband(st, m){
  let s = rod([XC, 4.5, ZC + RZ - 1], [XC, 4.5, BAND_Z + .5], 1.3, METAL, toneI, 1)
        + rod([XC, 53.5, ZC + RZ - 1], [XC, 53.5, BAND_Z + .5], 1.3, METAL, toneI, 1);
  const d = pd(bandPts(), false);
  s += `<path d="${d}" ${CAPS} stroke="${INK}" ${sw(4.6 + 2.4*INK_K)}/>` + `<path d="${d}" ${CAPS} stroke="${m.m}" ${sw(4.6)}/>`
     + `<path d="${d}" ${CAPS} stroke="${m.l}" ${sw(1.6)} transform="translate(-.4 -1.3)"/>`;
  if (wireOn(st)) s += `<path d="${d}" ${CAPS} stroke="${RED}" ${sw(1.3)} pathLength="1" stroke-dasharray=".05 .07" stroke-dashoffset="${f(-st.tk*.5 % 1)}"/>`;
  return s;
}
function phone(st){
  const base = on(PZ(0), rrUV(PH[0], PH[1], PH[2], PH[3], 3)), top = on(PZ(1.8), rrUV(PH[0], PH[1], PH[2], PH[3], 3));
  let s = loft(base, top, n => toneI(n, DARK)) + fill(pd(top), DARK.m)
        + fill(pd(on(PZ(1.85), rrUV(PH[0] + 1.3, PH[1] + 1.2, PH[2] - 1.3, PH[3] - 1.2, 2))), SCREEN);
  const yc = (PH[1] + PH[3]) / 2, z = 1.9, W_ = '#ffffff', G = '#9aa3c0', OK = '#43c25c';
  s += txZ(52, yc, z, 'Bluetooth', 2.6, W_, 700);
  const found = st.link || st.paired || (st.phase === 'pair' && st.pairS >= PAIR_E[0]);
  if (!found) s += txZ(56.5, yc, z, st.phase === 'pair' ? 'Searching...' : 'Not connected', 1.8, G);
  else {
    // pairing: the name shows up, then your tap lights its row while they swap the code
    const tapped = st.phase === 'pair' && st.pairS >= PAIR_E[1];
    if (tapped) s += fill(pd(on(PZ(1.88), rrUV(54.6, PH[1] + 2, 61.6, PH[3] - 2, 1.2))), '#2c3d80');
    s += txZ(56.5, yc, z, 'OPS Headphones', 1.65, W_);
    s += st.link ? txZ(60, yc, z, 'Connected', 1.8, OK)
       : txZ(60, yc, z, tapped ? 'Pairing...' : st.phase === 'pair' ? 'Tap to pair' : 'Not connected', 1.7, tapped ? W_ : G);
  }
  if (st.phase === 'play'){
    s += txZ(67, yc, z, 'Now playing', 1.9, G, 500) + txZ(70.6, yc, z, 'Fight Song', 2.3, W_, 700);
    const p = st.pt / PLAY_T, ya = PH[3] - 4, yb = PH[1] + 4;
    s += `<path d="${pd([[73.5, ya, z], [73.5, yb, z]], false)}" stroke="${G}" stroke-width=".9" stroke-linecap="round" fill="none"/>`
       + `<path d="${pd([[73.5, ya, z], [73.5, lerp(ya, yb, p), z]], false)}" stroke="${RED}" stroke-width="1.1" stroke-linecap="round" fill="none"/>`;
  }
  return act('phone', s + hullInk([...base, ...top], 1.8));
}
function powerStrip(){
  const [x0, y0, x1, y1, h] = STRIP;
  let s = box(x0, y0, 0, x1, y1, h, CERAMIC, tone, 1);
  for (const x of [64, 73]) s += shape(on(PZ(h + .05), rrUV(x - 2.4, y0 + 1.6, x + 2.4, y1 - 1.6, 1.2)), CERAMIC.m, .6)
    + line(on(PZ(h + .1), [[x - 1, y0 + 2.8], [x - 1, y0 + 3.8]]), 1) + line(on(PZ(h + .1), [[x + 1, y0 + 2.8], [x + 1, y0 + 3.8]]), 1);
  s += shape(on(PZ(h + .05), rrUV(USB[0] - 1.3, USB[1] - 1.1, USB[0] + 1.3, USB[1] + 1.1, .4)), '#1a1d24', .6);
  return s;
}
function stripCord(){
  // out of the strip's back end and off the desk's left edge, toward the wall socket (clear of the labels)
  const q = smooth3([[STRIP[0], 67.5, 1.6], [48, 69, .9], [43, 72.5, .9], [40, BRD[3] - .3, .9]]);
  const d = pd(q, false);
  return `<path d="${d}" ${CAPS} stroke="${INK}" ${sw(1.4 + 2*INK_K)}/><path d="${d}" ${CAPS} stroke="${CABLE.m}" ${sw(1.4)}/>`;
}
// the charging cable: from the strip's USB port to the plug, which lies on the desk or sits in the ear cup
function cable(st){
  const k = ease(st.plug), xp = rimX(-5);
  const rest = [46.5, 58.5, .9], port = [xp + .2, 53.5, ZC - 5];
  const e = lerp3(rest, port, k); e[2] += 4 * Math.sin(Math.PI * k);
  const q = smooth3([[USB[0], USB[1], USB[2]], [USB[0], USB[1], USB[2] + 2.5], [53, 62.5, 1], [e[0] + 7, e[1] + .4, Math.max(.9, e[2] - .6)], [e[0] + 3.3, e[1], e[2]]]);
  const d = pd(q, false);
  let s = `<path d="${d}" ${CAPS} stroke="${INK}" ${sw(1.4 + 2*INK_K)}/><path d="${d}" ${CAPS} stroke="${CABLE.m}" ${sw(1.4)}/>`;
  if (st.phase === 'charge' && st.plug >= 1 && st.batt < 100)
    s += `<path d="${d}" ${CAPS} stroke="${RED}" ${sw(.8)} pathLength="1" stroke-dasharray=".04 .06" stroke-dashoffset="${f(-st.tk*.6 % 1)}"/>`;
  return s + box(e[0], e[1] - 1.1, e[2] - .7, e[0] + 3.3, e[1] + 1.1, e[2] + .7, CABLE, toneI, .8);
}
// radio: rings of waves spreading out from one antenna toward the other, and the song travelling as little bursts
function radio(st){
  const pa = P(...A_PH), pb = P(...antPos(st));         // to the antenna in the left cup, wherever it is
  const arcs = (from, to, o) => { const a = Math.atan2(to[1] - from[1], to[0] - from[0]); let s = '';
    for (let k = 0; k < 3; k++){ const r = 5 + ((st.tk * 18 + k * 10) % 30), op = (1 - (r - 5) / 30) * o;
      const p0 = [from[0] + r*Math.cos(a - .55), from[1] + r*Math.sin(a - .55)], p1 = [from[0] + r*Math.cos(a + .55), from[1] + r*Math.sin(a + .55)];
      s += `<path d="M${f(p0[0])} ${f(p0[1])}A${f(r)} ${f(r)} 0 0 1 ${f(p1[0])} ${f(p1[1])}" fill="none" stroke="${RED}" stroke-width="1.4" stroke-linecap="round" opacity="${op.toFixed(2)}"/>`; }
    return s; };
  let s = '';
  if (st.phase === 'pair'){ s += arcs(pa, pb, .9); if (st.pairS >= PAIR_E[0]) s += arcs(pb, pa, .9); }
  if (st.phase === 'play' && st.pt < PLAY_T - .2){
    const c = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2 - 12];
    for (let i = 0; i < 6; i++){ const u = (st.tk * .8 + i / 6) % 1, w = 1 - u;
      const X = w*w*pa[0] + 2*u*w*c[0] + u*u*pb[0], Y = w*w*pa[1] + 2*u*w*c[1] + u*u*pb[1];
      s += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.3" fill="${RED}" opacity="${(.4 + .5*Math.sin(Math.PI*u)).toFixed(2)}"/>`; }
  }
  return `<g pointer-events="none">${s}</g>`;
}

/* ---------- scene ---------- */
function scene(st, m){
  let s = '';
  // 0 the desk board (its top is the z = 0 plane), then the cast shadows on it
  OY += BRD[4]; s += board(...BRD); OY -= BRD[4];
  const onBoard = on(PZ(0), rrUV(BRD[0], BRD[1], BRD[2], BRD[3], BRD[5]));
  const bp = bandPts(); let sh = castShadow([...cupRing(0), ...cupRing(14, 1.3)]) + castShadow([...cupRing(49), ...cupRing(SH_Y)]);
  // the left cup's parts, wherever they are (together, these add up to the cup's own shadow)
  const sc = exDy(st, 'cushion'), sv = exDy(st, 'cover');
  sh += castShadow(shiftY([...cupRing(44, 1.3), ...cupRing(49, .6)], sc)) + castShadow(shiftY([...cupRing(SH_Y), ...cupRing(58)], sv));
  if (insideK(st) > .5){ const ds = exDy(st, 'speaker'), db = exDy(st, 'battery');
    sh += castShadow(shiftY([...on(PY(47.4), ellUV(XC, ZC, 7.9, 7.9, 16)), ...on(PY(52.2), ellUV(XC, ZC, 2, 2, 8))], ds))
        + castShadow([[XC - 6, 52.5 + db, ZC - 8], [XC + 6, 54.3 + db, ZC - 8], [XC - 6, 52.5 + db, ZC + 4], [XC + 6, 54.3 + db, ZC + 4]])
        + castShadow(on(PY(55 + exDy(st, 'chip')), ellUV(XC, ZC, 7.4, 10, 16))); }
  for (let i = 0; i < bp.length - 1; i++) sh += castShadow([bp[i], bp[i+1]].flatMap(p => [[p[0] - 2.3, p[1], p[2]], [p[0] + 2.3, p[1], p[2]]]));
  for (const y of [4.5, 53.5]) sh += castShadow([[XC - 1.3, y, ZC + RZ], [XC + 1.3, y, ZC + RZ], [XC - 1.3, y, BAND_Z], [XC + 1.3, y, BAND_Z]]);
  sh += castShadow([[PH[0], PH[1], 0], [PH[2], PH[1], 0], [PH[2], PH[3], 0], [PH[0], PH[3], 0], [PH[0], PH[1], 1.8], [PH[2], PH[1], 1.8], [PH[2], PH[3], 1.8], [PH[0], PH[3], 1.8]]);
  sh += castShadow([[STRIP[0], STRIP[1], 0], [STRIP[2], STRIP[1], 0], [STRIP[2], STRIP[3], 0], [STRIP[0], STRIP[3], 0], [STRIP[0], STRIP[1], STRIP[4]], [STRIP[2], STRIP[1], STRIP[4]], [STRIP[2], STRIP[3], STRIP[4]], [STRIP[0], STRIP[3], STRIP[4]]]);
  s += clipTo(onBoard, sh);
  // 1 the right ear cup (far), then the sound leaving its speaker
  s += rightCup(st, m);
  if (soundOn(st)) s += soundRings(st, 14.5, 1);
  // 2 the yokes and the headband (a wire inside it carries the sound to the right cup)
  s += headband(st, m);
  // 3 the sound leaving the left ear cushion (it faces away from us), then the left cup's parts in front of it
  if (soundOn(st) && insideK(st) < .5) s += soundRings(st, 43.5 + exDy(st, 'cushion'), -1);
  s += leftCup(st, m);
  // 4 what is on the desk in front: the phone, the strip's cord (it leaves the strip's back end), the power strip,
  //   then the charging cable that runs from the port on its top
  s += phone(st) + stripCord() + powerStrip() + cable(st);
  // 5 radio waves over everything, then the labels
  s += radio(st);
  // the parts inside the left cup are labelled on its cover, over where each one sits (Take apart shows them)
  const yv = 58 + exDy(st, 'cover');               // (they ride on the cover for the moment it starts to come off)
  s += tag([XC - 3, yv, ZC - 4], -74, 20, 'BATTERY', batteryOn(st));
  s += tag([XC + .5, yv, ZC + 6], -62, -44, 'ANTENNA', antOn(st));
  s += tag([XC + 1, yv, ZC], -78, -8, 'CHIP', chipWorking(st));
  s += tag([XC, 12.8, ZC + 1.5], 92, -42, 'SPEAKER', soundOn(st));
  return s;
}

/* ---------- behaviour ---------- */
let ui;
function charge(st, ui){
  if (busy(st)) return ui.flash('Wait for this step to finish');
  if (st.batt >= 99.5) return ui.flash('The battery is already full');
  st.phase = 'charge'; st.cs = 'in'; const b0 = st.batt; let t = 0;
  const [e0, e1, e2] = CHARGE_E;
  ui.animate(dt => { t += dt; st.tk += dt;
    if (t < e0){ st.plug = Math.min(1, t / .9); return true; }
    st.plug = 1;
    if (t < e1){ st.cs = 'fill'; st.batt = lerp(b0, 100, ease((t - e0) / (e1 - e0))); return true; }
    st.batt = 100; st.cs = 'out';
    st.plug = 1 - clamp01((t - e1 - 1.5) / .9);                // a moment to see the green light, then it unplugs
    if (t >= e2){ st.plug = 0; st.tk = 0; st.phase = 'idle'; return false; } return true; });
}
function powerOn(st, ui){
  if (busy(st)) return ui.flash('Wait for this step to finish');
  if (st.on) return ui.flash('The headphones are already on');
  if (st.batt < 1) return ui.flash('Nothing happens: the battery is empty. Charge it first');
  st.phase = 'power'; st.tk = 0; let t = 0;
  ui.animate(dt => { t += dt; st.tk += dt;
    st.press = t < 1.2 ? Math.min(1, t / .15) * .8 : Math.max(0, .8 - (t - 1.2) / .15 * .8);
    if (t >= READ_S(CAP.power)){ st.press = 0; st.tk = 0; st.on = true; st.link = st.paired; st.phase = 'idle'; return false; } return true; });
}
function pair(st, ui){
  if (busy(st)) return ui.flash('Wait for this step to finish');
  if (!st.on) return ui.flash(st.batt < 1 ? 'The battery is empty: charge it first' : 'Turn the headphones on first: the radio inside needs power');
  if (st.link) return ui.flash('Already connected to the phone');
  st.phase = 'pair'; st.pairS = 0;
  ui.animate(dt => { st.tk += dt; st.pairS = Math.min(PAIR_E[2], st.pairS + dt);
    if (st.pairS >= PAIR_E[2]){ st.link = st.paired = true; st.tk = 0; st.phase = 'idle'; return false; } return true; });
}
function play(st, ui){
  if (busy(st)) return ui.flash('Wait for this step to finish');
  if (!st.on) return ui.flash(st.batt < 1 ? 'The battery is empty: charge it first' : 'Turn the headphones on first');
  if (!st.link) return ui.flash("Pair first: the phone doesn't know where to send the song yet");
  st.phase = 'play'; st.pt = 0; const b0 = st.batt;
  ui.animate(dt => { st.pt = Math.min(PLAY_T, st.pt + dt); st.tk += dt; st.batt = b0 - 2 * st.pt / PLAY_T;
    if (st.pt >= PLAY_T){ st.played = true; st.tk = 0; st.phase = 'idle'; return false; } return true; });
}
function turnOff(st, ui){
  if (busy(st)) return ui.flash('Wait for this step to finish');
  if (!st.on) return ui.flash('The headphones are already off');
  st.phase = 'off'; let t = 0;
  ui.animate(dt => { t += dt; st.press = t < .7 ? .8 : 0; if (t >= .7) st.on = st.link = false;   // the phone loses it too
    if (t >= READ_S(CAP.off)){ st.press = 0; st.on = st.link = st.played = false; st.phase = 'idle'; return false; } return true; });
}

ui = mountFigure({
  fig:'05', title:'Bluetooth headphones', hint:'charge them, turn them on, pair the phone, play a song, take them apart',
  size:[HP_W, HP_D, HP_H],
  state:{ phase:'idle', cs:'', batt:0, plug:0, on:false, paired:false, link:false, played:false, press:0, pairS:0, pt:0, tk:0 },
  scene,
  caption: st => {
    const ph = st.phase;
    if (ph === 'charge') return CAP[{ in:'plugIn', fill:'fill', out:'full' }[st.cs]];
    if (ph === 'power') return CAP.power;
    if (ph === 'pair') return CAP[['ask', 'answer', 'code'][stageOf(PAIR_E, st.pairS)]];
    if (ph === 'play') return CAP[['send', 'chip', 'wire', 'sound'][stageOf(PLAY_E, st.pt)]];
    if (ph === 'off') return CAP.off;
    if (st.batt < 1) return 'These wireless headphones are out of energy. Charge them first.';
    if (!st.on) return st.paired ? 'Off. They remember the phone, so next time they connect on their own.' : 'Charged and ready. Turn the headphones on.';
    if (!st.link) return 'On, with a blue light: they are ready to pair. Pair them from the phone.';
    if (st.played) return 'The song went from the phone by radio to the chip, then by wire to both speakers. Turn them off when you are done.';
    return 'Paired with the phone. Play a song on it.';
  },
  stats: st => [ { label:'Battery', value:`${Math.round(st.batt)}%` } ],
  buttons:[
    { label:'Charge', onClick:charge, predict:'Wireless headphones have no cord when you wear them. Where will they get the energy to make sound?' },
    { label:'Power on', onClick:powerOn },
    { label:'Pair', onClick:pair, predict:"There's no wire between the phone and the headphones. How could they find each other and start talking?" },
    { label:'Play music', onClick:play, predict:'The song arrives as radio signals. What has to happen inside the headphones before you can hear it?' },
    { label:'Turn off', onClick:turnOff, predict:'When you turn them back on tomorrow, will you have to pair them again? Why or why not?' },
  ],
  walk:['Charge', 'Power on', 'Pair', 'Play music', 'Turn off'],     // the engine adds Take apart as the last step
  // Take apart: the left ear cup slides apart along its axis. The dashed line is the song's path through it.
  apart:{ flow:'signal',
    parts: st => [
      { label:'ANTENNA', pos:antPos(st), tag:[-74, -26], on:antOn },
      { label:'CHIP', pos:[XC + 1, 55.9 + exDy(st, 'chip') + 1.4, ZC + 2.2], tag:[-44, -86], on:chipWorking },
      { label:'BATTERY', pos:[XC + 2, 54.3 + exDy(st, 'battery'), ZC + 4], tag:[-40, -110], on:batteryOn },
      { label:'SPEAKER', pos:spkPos(st), tag:[-12, -176], on:soundOn },
      { label:'CUSHION', pos:[XC + 7, 49 + exDy(st, 'cushion'), ZC + 8], tag:[90, -112] },
      { label:'COVER', pos:[XC - 4, 58 + exDy(st, 'cover'), ZC - 4], tag:[-40, 46] } ],
    path: st => [antPos(st), chipPos(st), spkPos(st), cushPos(st)],
    caption: st => {
      const ph = st.phase;
      if (ph === 'power') return CAP.power;
      if (ph === 'pair') return CAP[['ask', 'answer', 'code'][stageOf(PAIR_E, st.pairS)]];
      if (ph === 'play') return CAP[['send', 'chip', 'wire', 'sound'][stageOf(PLAY_E, st.pt)]];
      if (ph === 'off') return CAP.off;
      if (st.batt < 1) return CAP.xDead;
      if (!st.on) return CAP.xOff;
      if (!st.link) return CAP.xOn;
      return st.played ? CAP.xDone : CAP.xLink; },
    in:CAP.xIn,
    predict:'What inside the ear cup turns the radio signal into sound?',
    allow:['Power on', 'Pair', 'Play music', 'Turn off', 'power', 'phone'],
    ready: st => busy(st) ? 'Wait for this step to finish' : '' },
  // press the parts themselves: the button on the ear cup, or the phone (pair it, then play)
  acts:{ power:(st,el,ui) => st.on ? turnOff(st,ui) : powerOn(st,ui), phone:(st,el,ui) => st.link ? play(st,ui) : pair(st,ui) },
  params:(st, q) => {
    if (['charged','on','paired','play'].some(k => q.has(k))) st.batt = 100;
    if (q.has('on') || q.has('paired') || q.has('play')) st.on = true;
    if (q.has('paired') || q.has('play')) st.link = st.paired = true;
    if (q.has('play')){ st.phase = 'play'; st.pt = Math.min(PLAY_T - .3, +q.get('play')); st.tk = st.pt; }
    if (q.has('ex')) st.ex = +q.get('ex') || 1;
  },
});
</script>
</body>
</html>
