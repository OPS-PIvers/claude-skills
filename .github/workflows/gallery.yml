name: OPS Figures gallery

# Builds every ops-figures example (plus anything in gallery/figures/) into a GitHub Pages site with an index.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/pauls-skills/skills/ops-figures/**'
      - 'gallery/**'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python gallery/build.py _site --shots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
