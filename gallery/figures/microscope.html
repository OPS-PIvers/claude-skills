<script>

const sp0 = slidePos(st, g); if (sp0[2] < 1) sh += castShadow([[sp0[0]-4, sp0[1]-13, 0], [sp0[0]+4, sp0[1]+13, .6], [sp0[0]+4, sp0[1]-13, 0], [sp0[0]-4, sp0[1]+13, .6]]);
let up = castShadow([[24, 9, g.st], [58, 9, g.st], [58, 43, g.st], [24, 43, g.st], [24, 9, g.st - 12], [58, 43, g.st - 12]])
+ castShadow([[30, 18, 66 + g.dh], [50, 18, 66 + g.dh], [50, 34, 84 + g.dh], [30, 34, 84 + g.dh], ad(g.eye, mu(ED, 31))]);
s += clipTo(onBoard, sh + `<g opacity="${(1 - g.k).toFixed(2)}">${up}</g>`);
const ia = g.a, inside = svg => ia > 0 ? `<g opacity="${ia.toFixed(2)}">${svg}</g>` : '';
s += base(st, m);
if (!st.slide && st.phase !== 'place') s += slide(st, sp0);
s += inside(bulb(st, g)) + beamSeg(st, g, 0, ia) + lens(g.coll, [0,0,1], 3.6, st.light) + beamSeg(st, g, 1);
s += rod([KN[0] + g.ax, 19 - 8*g.k, KN[1]], [KN[0] + g.ax, 13.5 - 8*g.k, KN[1]], 6.5, DARK, toneI, 1.3);
s += arm(g, m) + inside(pinion(st, g)) + act('knob', nearKnob(st, g));
s += iris(st, g) + beamSeg(st, g, 2) + condenser(st, g) + inside(lens(g.condLens, [0,0,1], 3.8, st.light)) + beamSeg(st, g, 3);
s += carrier(st, g) + stage(st, g);
const sl = st.slide || st.phase === 'place' ? slide(st, sp0) : '';
s += g.k > .1 ? clips(g) + sl : sl + clips(g);
s += beamSeg(st, g, 4) + inside(lens(g.objLens, [0,0,1], 1.8, st.light, .8)) + beamSeg(st, g, 5);
s += [...g.obj].sort((p, q) => depthOf(avg([p.top, p.tip])) - depthOf(avg([q.top, q.tip]))).map(o => objective(st, o)).join('');
s += beamSeg(st, g, 6) + turret(st, g, m) + head(st, g, m) + inside(prism(st, g)) + beamSeg(st, g, 7, ia);
s += tube(st, g, m) + eyepiece(st, g) + inside(lens(g.eyeLens, ED, 2.4, st.light)) + beamSeg(st, g, 8);
const lit = st.light, look = lit && st.slide, ph = st.phase, act_ = g.act;
const focusing = ph === 'focus' && st.ft < FOCUS_E[0];
const kc = [KN[0] + g.ax, 41.5 + g.kdy, KN[1]];
if (g.k < .5){
s += tag(ad(g.eye, mu(ED, 27)), 34, -46, 'EYEPIECE', look);
s += tag(ad(act_.top, mu(act_.d, 8)), -132, -6, 'OBJECTIVE', look || ph === 'rotate');
s += tag([58, 12, g.st - 1], 60, 70, 'STAGE', ph === 'place' || focusing);
s += tag(kc, -78, 32, 'FOCUS KNOB', focusing);
s += tag([XO - 3, YO + 3, 10.4], -70, 58, 'LAMP', lit);
} else {
s += tag(ad(g.eye, mu(ED, 27)), 40, -30, 'EYEPIECE', lit);
s += tag([g.prism[0] - 3.4, YO + 3.2, g.prism[2]], -70, -8, 'PRISM', lit);
s += tag(ad(act_.top, mu(act_.d, 7)), 110, -10, 'OBJECTIVE', lit);
s += tag([58, 20, g.st - 1], 64, -6, 'STAGE', false);
s += tag([XO + 5.5, YO - 1, g.cond + 4], 108, 4, 'CONDENSER', lit);
s += tag([XO + 5, YO - 3, g.iris + 1], 92, 26, 'IRIS', lit);
s += tag(g.bulb, 98, 34, 'LAMP', lit);
s += tag([KN[0] + g.ax, 26 + g.kdy, KN[1] + 3], -50, -40, 'GEARS', false);
s += tag(kc, -50, 30, 'FOCUS KNOB', false);
}
return s;
}
let ui;
function lightBtn(st, ui){
if (busy(st)) return ui.flash('Wait for this step to finish');
if (st.light){ st.light = false; st.lk = 0; return; }
st.light = true; st.lk = 0; st.phase = 'light'; let t = 0;
ui.animate(dt => { t += dt; st.tk += dt; st.lk = Math.min(1, t / 1.8);
if (t >= READ_S(CAP.light)){ st.lk = 1; st.phase = 'idle'; return false; } return true; });
}
function placeSlide(st, ui){
if (busy(st)) return ui.flash('Wait for this step to finish');
if (apart(st)) return ui.flash('Put the microscope back together first');
if (st.slide) return ui.flash('The slide is already on the stage');
st.phase = 'place'; st.sp = 0; let t = 0;
ui.animate(dt => { t += dt; st.tk += dt; st.sp = Math.min(1, t / 2.6);
if (t >= READ_S(CAP.place)){ st.slide = 1; st.sp = 0; st.phase = 'idle'; return false; } return true; });
}
function focus(st, ui){
if (busy(st)) return ui.flash('Wait for this step to finish');
if (apart(st)) return ui.flash('Put the microscope back together first');
if (!st.slide) return ui.flash('Put a slide on the stage first: there is nothing to focus on yet');
if (!st.light) return ui.flash('Turn on the light first: in the dark there is nothing to focus on');
if (st.sz > -.3) return ui.flash('It is already sharp');
st.phase = 'focus'; st.ft = 0; const z0 = st.sz, k0 = st.knob, run = FOCUS_E[0] - .8;
ui.animate(dt => { st.ft += dt; st.tk += dt; const p = ease(clamp01(st.ft / run));
st.sz = lerp(z0, 0, p); st.knob = k0 + p * 2.6 * Math.PI;
if (st.ft >= FOCUS_E[1]){ st.sz = 0; st.phase = 'idle'; return false; } return true; });
}
function rotateTo(st, ui, j){
if (busy(st)) return ui.flash('Wait for this step to finish');
st.phase = 'rotate'; const r0 = st.rot; let t = 0;
ui.animate(dt => { t += dt; st.tk += dt; st.rot = lerp(r0, j, ease(clamp01(t / 1.6)));
if (t >= READ_S(CAP.rotate)){ st.rot = st.obj = j; st.phase = 'idle'; return false; } return true; });
}
function explode(st, ui){
if (busy(st)) return ui.flash('Wait for this step to finish');
const out = !apart(st), e0 = st.ex; st.phase = out ? 'apart' : 'join'; let t = 0;
const hold = READ_S(out ? CAP.apart : CAP.join);
ui.animate(dt => { t += dt; st.tk += dt; st.ex = lerp(e0, out ? 1 : 0, clamp01(t / 2.2));
if (t >= hold){ st.ex = out ? 1 : 0; st.phase = 'idle'; return false; } return true; });
}
ui = mountFigure({
fig:'06', title:'Microscope', hint:'turn on the light, place a slide, focus, change lenses, explode it',
size:[MS_W, MS_D, MS_H],
state:{ phase:'idle', light:false, lk:0, slide:0, sp:0, sz:-8, ft:0, obj:0, rot:0, ex:0, knob:0, tk:0 },
scene,
caption: st => {
const ph = st.phase;
if (ph === 'light') return CAP.light;
if (ph === 'place') return CAP.place;
if (ph === 'focus') return st.ft < FOCUS_E[0] ? CAP.focus1 : CAP.focus2;
if (ph === 'rotate') return CAP.rotate;
if (ph === 'apart') return CAP.apart;
if (ph === 'join') return CAP.join;
if (apart(st)) return st.light ? CAP.apartOn : CAP.apartOff;
if (!st.slide) return st.light ? CAP.noSlide : CAP.start;
if (!st.light) return CAP.dark;
if (st.sz < -.3) return CAP.blurry;
return CAP['see' + st.obj];
},
stats: st => [ { label:'Magnification', value:`${OBJS[st.obj].mag * 10}x` } ],
buttonsLabel:'Microscope',
buttons:[
{ label:'Light', onClick:lightBtn, predict:'You look down into the microscope from the top. Where does the light have to come from to see through a thin slice of onion?' },
{ label:'Place slide', onClick:placeSlide },
{ label:'Focus', onClick:focus, predict:"Turning the focus knob doesn't change any of the lenses. So how can it make a blurry picture sharp?" },
{ label:'Objective', predict:'A stronger objective makes things look bigger. Will you see more cells, or fewer?',
choices: st => OBJS.map((o, i) => ({ label:`${o.mag}x`, current: st.obj === i, disabled: apart(st),
why:'Put the microscope back together first', onClick:(st, ui) => rotateTo(st, ui, i) })) },
{ label:'Explode view', onClick:explode, predict:'Before it comes apart: how many lenses do you think the light goes through on its way to your eye?' },
],
walk:['Light', 'Place slide', 'Focus', 'Objective>10x', 'Explode view'],
acts:{ lamp:lightBtn, knob:focus, slide:placeSlide },
params:(st, q) => {
if (q.has('light')){ st.light = true; st.lk = 1; }
if (q.has('slide') || q.has('focus')) st.slide = 1;
if (q.has('focus')) st.sz = 0;
if (q.has('obj')) st.obj = st.rot = +q.get('obj');
if (q.has('ex')) st.ex = +q.get('ex') || 1;
},
});
</script>
